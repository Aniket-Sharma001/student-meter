<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMate Manager | Reports</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
      .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .sidebar { background: #111827; color: white; padding: 24px 18px; }
      .sidebar .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; margin-bottom: 28px; }
      .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,0.1); }
      .nav a { display: block; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: #dbeafe; margin-bottom: 8px; font-weight: 600; }
      .nav a.active, .nav a:hover { background: rgba(255,255,255,0.08); }
      .main { padding: 24px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
      .card { background: white; padding: 18px; border-radius: 16px; box-shadow: 0 10px 22px rgba(15,23,42,0.04); }
      .card .label { color: #6b7280; font-size: 0.82rem; }
      .card .value { margin-top: 12px; font-weight: 800; font-size: 1.7rem; }
      .panel { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 10px 22px rgba(15,23,42,0.04); }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eef2f7; }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">RM</div>
          <span>RoomMate</span>
        </div>
        <nav class="nav">
          <a href="../dashboard.html">Dashboard</a>
          <a href="rooms.html">Rooms</a>
          <a href="expenses.html">Expenses</a>
          <a href="rent-bills.html">Rent & Bills</a>
          <a href="payments.html">Payments</a>
          <a href="reports.html" class="active">Reports</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="logoutButton">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h2>Monthly Report</h2>
            <p style="margin: 4px 0 0; color: #6b7280;">Summary of rent, bills and contribution record.</p>
          </div>
        </div>

        <section class="cards">
          <div class="card"><div class="label">Total Rent</div><div class="value" id="totalRent">₹0</div></div>
          <div class="card"><div class="label">Electricity</div><div class="value" id="totalElectricity">₹0</div></div>
          <div class="card"><div class="label">Groceries</div><div class="value" id="totalGroceries">₹0</div></div>
          <div class="card"><div class="label">Food</div><div class="value" id="totalFood">₹0</div></div>
          <div class="card"><div class="label">Total Expense</div><div class="value" id="totalExpense">₹0</div></div>
        </section>

        <section class="panel">
          <h3>Category Breakdown</h3>
          <table>
            <thead>
              <tr><th>Category</th><th>Amount</th></tr>
            </thead>
            <tbody id="reportTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/reports.js"></script>
  </body>
</html>
