<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMate Manager | Expenses</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
      .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .sidebar { background: #111827; color: white; padding: 24px 18px; }
      .sidebar .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; margin-bottom: 28px; }
      .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,0.1); }
      .nav a { display: block; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: #dbeafe; margin-bottom: 8px; font-weight: 600; }
      .nav a.active, .nav a:hover { background: rgba(255,255,255,0.08); }
      .main { padding: 24px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
      .panel { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 10px 22px rgba(15,23,42,0.04); }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
      label { display: block; font-weight: 600; }
      input, select, textarea { width: 100%; margin-top: 8px; padding: 11px 12px; border: 1px solid #e5e7eb; border-radius: 10px; }
      textarea { min-height: 90px; resize: vertical; }
      .primary-btn, .secondary-btn { border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
      .primary-btn { background: #4f46e5; color: white; }
      .secondary-btn { background: #eef2ff; color: #3730a3; }
      table { width: 100%; border-collapse: collapse; margin-top: 18px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #eef2f7; text-align: left; }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">RM</div>
          <span>RoomMate</span>
        </div>
        <nav class="nav">
          <a href="../dashboard.html">Dashboard</a>
          <a href="rooms.html">Rooms</a>
          <a href="expenses.html" class="active">Expenses</a>
          <a href="rent-bills.html">Rent & Bills</a>
          <a href="payments.html">Payments</a>
          <a href="reports.html">Reports</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="logoutButton">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <h2>Expense Management</h2>
            <p style="margin: 4px 0 0; color: #6b7280;">Track groceries, food, utilities and shared costs.</p>
          </div>
        </div>

        <section class="panel">
          <h3>Add Expense</h3>
          <form id="expenseForm">
            <div class="form-grid">
              <div>
                <label>Expense Title
                  <input type="text" id="title" placeholder="Groceries" required />
                </label>
              </div>
              <div>
                <label>Category
                  <select id="category">
                    <option>Grocery</option>
                    <option>Electricity</option>
                    <option>Internet</option>
                    <option>Food</option>
                    <option>Rent</option>
                    <option>Cleaning</option>
                    <option>Transportation</option>
                    <option>Other</option>
                  </select>
                </label>
              </div>
              <div>
                <label>Amount
                  <input type="number" id="amount" min="0" step="0.01" required />
                </label>
              </div>
              <div>
                <label>Date
                  <input type="date" id="expenseDate" required />
                </label>
              </div>
              <div>
                <label>Paid By
                  <input type="text" id="paidBy" placeholder="Rahul" />
                </label>
              </div>
              <div>
                <label>Room ID
                  <input type="number" id="roomId" value="1" min="1" required />
                </label>
              </div>
            </div>
            <div style="margin-top: 14px;">
              <label>Description
                <textarea id="description" placeholder="Describe the expense"></textarea>
              </label>
            </div>
            <div style="margin-top: 16px;">
              <button class="primary-btn" type="submit">Add Expense</button>
            </div>
          </form>
        </section>

        <section class="panel" style="margin-top: 18px;">
          <h3>Recent Expense History</h3>
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Paid By</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/expenses.js"></script>
  </body>
</html>
