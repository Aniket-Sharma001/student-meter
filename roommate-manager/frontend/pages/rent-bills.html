<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMate Manager | Rent & Bills</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
      .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .sidebar { background: #111827; color: white; padding: 24px 18px; }
      .sidebar .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; margin-bottom: 28px; }
      .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,0.1); }
      .nav a { display: block; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: #dbeafe; margin-bottom: 8px; font-weight: 600; }
      .nav a.active, .nav a:hover { background: rgba(255,255,255,0.08); }
      .main { padding: 24px; }
      .panel { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 10px 22px rgba(15,23,42,0.04); }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
      label { display: block; font-weight: 600; }
      input, select { width: 100%; margin-top: 8px; padding: 11px 12px; border: 1px solid #e5e7eb; border-radius: 10px; }
      .primary-btn { border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: #4f46e5; color: white; }
      table { width: 100%; border-collapse: collapse; margin-top: 18px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #eef2f7; text-align: left; }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">RM</div>
          <span>RoomMate</span>
        </div>
        <nav class="nav">
          <a href="../dashboard.html">Dashboard</a>
          <a href="rooms.html">Rooms</a>
          <a href="expenses.html">Expenses</a>
          <a href="rent-bills.html" class="active">Rent & Bills</a>
          <a href="payments.html">Payments</a>
          <a href="reports.html">Reports</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="logoutButton">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <h2>Rent & Electricity Bills</h2>
            <p style="margin: 4px 0 0; color: #6b7280;">Manage monthly rent and electricity charges.</p>
          </div>
        </div>

        <section class="panel">
          <h3>Rent Summary</h3>
          <div class="form-grid">
            <div>
              <label>Monthly Rent
                <input type="number" value="12000" />
              </label>
            </div>
            <div>
              <label>Due Date
                <input type="date" />
              </label>
            </div>
            <div>
              <label>Amount Paid
                <input type="number" value="7000" />
              </label>
            </div>
          </div>
          <div style="margin-top: 16px;"><button class="primary-btn" type="button">Save Rent</button></div>
        </section>

        <section class="panel" style="margin-top: 18px;">
          <h3>Electricity Bill</h3>
          <div class="form-grid">
            <div><label>Prev Reading<input type="number" value="1200" /></label></div>
            <div><label>Current Reading<input type="number" value="1450" /></label></div>
            <div><label>Units Consumed<input type="number" value="250" /></label></div>
            <div><label>Rate / Unit<input type="number" value="7" /></label></div>
            <div><label>Total Bill<input type="number" value="1750" /></label></div>
          </div>
          <div style="margin-top: 16px;"><button class="primary-btn" type="button">Save Electricity</button></div>
        </section>
      </main>
    </div>

    <script src="../js/common.js"></script>
  </body>
</html>
