<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMate Manager | Profile</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
      .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .sidebar { background: #111827; color: white; padding: 24px 18px; }
      .sidebar .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; margin-bottom: 28px; }
      .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,0.1); }
      .nav a { display: block; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: #dbeafe; margin-bottom: 8px; font-weight: 600; }
      .nav a.active, .nav a:hover { background: rgba(255,255,255,0.08); }
      .main { padding: 24px; }
      .panel { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 10px 22px rgba(15,23,42,0.04); }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
      label { display: block; font-weight: 600; }
      input { width: 100%; margin-top: 8px; padding: 11px 12px; border: 1px solid #e5e7eb; border-radius: 10px; }
      .primary-btn { border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: #4f46e5; color: white; }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">RM</div>
          <span>RoomMate</span>
        </div>
        <nav class="nav">
          <a href="../dashboard.html">Dashboard</a>
          <a href="rooms.html">Rooms</a>
          <a href="expenses.html">Expenses</a>
          <a href="rent-bills.html">Rent & Bills</a>
          <a href="payments.html">Payments</a>
          <a href="reports.html">Reports</a>
          <a href="profile.html" class="active">Profile</a>
          <a href="#" id="logoutButton">Logout</a>
        </nav>
      </aside>

      <main class="main">
        <div class="panel">
          <h2>Profile</h2>
          <form id="profileForm">
            <div class="form-grid">
              <div>
                <label>Full Name
                  <input type="text" id="fullName" />
                </label>
              </div>
              <div>
                <label>Email
                  <input type="email" id="email" disabled />
                </label>
              </div>
              <div>
                <label>Mobile Number
                  <input type="text" id="mobileNumber" />
                </label>
              </div>
            </div>
            <div style="margin-top: 18px;">
              <button class="primary-btn" type="submit">Update Profile</button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
